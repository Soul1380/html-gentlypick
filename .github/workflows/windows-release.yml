name: Build Windows release
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 1.0.1'
        required: false
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build desktop and update archive
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG_VERSION: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          . ./version-tools.ps1
          $requested = if ($env:INPUT_VERSION) {$env:INPUT_VERSION} elseif ($env:REF_TYPE -eq 'tag') {$env:TAG_VERSION} else {''}
          $version = Get-ProjectVersion -Root $PWD -Requested $requested
          ./build-desktop.ps1
          ./build-installer.ps1 -Package ./dist/LightExcerpt-win-x64-update.zip
      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG_VERSION: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          . ./version-tools.ps1
          $requested = if ($env:INPUT_VERSION) {$env:INPUT_VERSION} elseif ($env:REF_TYPE -eq 'tag') {$env:TAG_VERSION} else {''}
          $version = Get-ProjectVersion -Root $PWD -Requested $requested
          gh release view "v$version" 2>$null
          if ($LASTEXITCODE -ne 0) {
            $notes = "docs/release-v$version.md"
            if (Test-Path -LiteralPath $notes -PathType Leaf) {
              gh release create "v$version" --target $env:GITHUB_SHA --title "轻摘 v$version" --notes-file $notes --draft
            } else {
              gh release create "v$version" --target $env:GITHUB_SHA --title "轻摘 v$version" --generate-notes --draft
            }
            if ($LASTEXITCODE -ne 0) { throw '创建 Release 失败，请检查上方错误。' }
          }
          gh release upload "v$version" "dist/LightExcerpt-win-x64-update.zip" "dist/GentlyPick-v$version-win-x64.zip" "dist/GentlyPickSetup-v$version.exe" "dist/SHA256.txt"
          if ($LASTEXITCODE -ne 0) { throw '上传发布附件失败。' }

          gh release edit "v$version" --draft=false
          if ($LASTEXITCODE -ne 0) { throw '发布 Release 失败。' }

      - name: Refresh fallback update feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./version-tools.ps1
          $version = Get-ProjectVersion -Root $PWD
          $repo = $env:GITHUB_REPOSITORY
          $feed = gh api "repos/$repo/releases/tags/v$version"
          if ($LASTEXITCODE -ne 0) { throw '无法读取正式发布信息' }
          $release = $feed | ConvertFrom-Json
          if ($release.draft -or $release.prerelease) { throw '不能发布测试版本的备用更新源' }
          $sha = gh api "repos/$repo/contents/update-feed.json?ref=main" --jq .sha 2>$null
          $body = @{message="Update fallback feed for v$version [skip ci]";branch='main';content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($feed -join "`n")))}
          if ($LASTEXITCODE -eq 0 -and $sha) { $body.sha=$sha }
          $body | ConvertTo-Json | Set-Content feed-request.json -Encoding utf8
          gh api --method PUT "repos/$repo/contents/update-feed.json" --input feed-request.json > $null
          if ($LASTEXITCODE -ne 0) { throw '备用更新源同步失败' }
