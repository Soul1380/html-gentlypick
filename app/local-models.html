</style><script src="/ui-components.js"></script><script>try{document.documentElement.dataset.theme=localStorage.getItem('gentlypick-theme')||'light'}catch{}</script><main><header><h1>本地模型</h1><a href="/" id="backToWorkspace">返回轻摘</a></header><section class="card"><div class="row"><h2>运行状态</h2><button id="refresh" type="button" title="重新读取运行状态和模型列表，不启动或安装程序">刷新状态</button></div><p class="environment-hint">刷新仅检查状态和模型列表；已有模型会从原保存目录读取。</p><p id="status">正在读取运行状态…</p><div class="row"><button id="startOllama" type="button" hidden>启动 Ollama</button><button id="setupOllama" type="button" hidden>补全运行环境</button></div><p id="environmentStatus" role="status"></p><div class="model-summary"><div><strong>模型库</strong><p id="inventorySummary">正在读取模型…</p></div><button id="openModelManager" type="button" aria-haspopup="dialog">查看模型列表 →</button></div></section><section class="card"><h2>下载新的 DeepSeek 模型</h2><small>下面是可下载版本清单，已有模型请使用上方的本机模型列表。</small><select id="deepseek" aria-label="DeepSeek 版本" hidden></select><button class="model-picker" id="deepseekPicker" type="button" aria-haspopup="dialog"><span>选择模型</span><span aria-hidden="true">⌄</span></button><label>保存目录 <input id="directory" type="text" placeholder="例如 D:\DeepSeekLocal\downloads" style="width:100%;padding:10px;border:1px solid #d8e4d8;border-radius:9px"></label><p><button id="download">下载所选版本</button> <button id="cancelDownload" disabled>取消</button></p><label><input type="checkbox" id="installAfter" checked> 下载后导入 Ollama</label><progress id="downloadProgress" max="100" value="0" style="width:100%"></progress><p id="downloadStatus" role="status"></p><p><button type="button" onclick="GPUI.reveal(document.getElementById('directory').value)">📁 打开下载目录</button> <a id="deepseekLink" href="https://modelscope.cn" target="_blank" rel="noopener">查看模型文件</a></p></section><section class="card"><div class="row"><h2>Whisper</h2><button id="discoverWhisper" type="button">自动查找</button></div><small id="discoveryStatus" role="status"></small><select id="whisper" aria-label="Whisper 版本" hidden></select><button class="model-picker" id="whisperPicker" type="button" aria-haspopup="dialog"><span>选择模型</span><span aria-hidden="true">⌄</span></button><label>模型保存目录 <input id="whisperDirectory" type="text" placeholder="例如 D:\DeepSeekLocal" style="width:100%;padding:10px;border:1px solid #d8e4d8;border-radius:9px"></label><label>Python 路径 <input id="pythonPath" type="text" placeholder="Python 3.10–3.12 的 python.exe 完整路径" style="width:100%;padding:10px;border:1px solid #d8e4d8;border-radius:9px"></label><p><button id="whisperInstall">安装所选版本</button> <button id="whisperCancel" disabled>取消</button></p><div id="whisperProgressPanel" class="install-progress" hidden><div class="progress-heading"><strong id="whisperProgressTitle">准备安装</strong><span id="whisperPercent">等待开始</span></div><div class="install-steps" aria-label="安装步骤"><span data-step="prepare">准备环境</span><span data-step="dependencies">安装组件</span><span data-step="download">下载模型</span><span data-step="verify">校验模型</span></div><progress id="whisperProgress" max="100" aria-label="Whisper 模型下载进度"></progress><div class="progress-metrics"><span id="whisperBytes">正在读取下载信息…</span><span id="whisperSpeed"></span><span id="whisperElapsed"></span></div><details><summary>查看安装详情</summary><pre id="whisperDetail"></pre></details></div><p id="whisperStatus" role="status"></p><p><button type="button" onclick="GPUI.reveal(document.getElementById('whisperDirectory').value+'\\whisper\\models')">📁 打开模型目录</button> <a id="whisperLink" href="https://huggingface.co" target="_blank" rel="noopener">查看模型文件</a></p></section></main><dialog id="modelManagerDialog" class="manager-dialog" aria-labelledby="modelManagerTitle"><div class="manager-header"><div><h2 id="modelManagerTitle">模型管理</h2><p>查看已安装模型，或导入本机模型文件。</p></div><button id="closeModelManager" type="button" aria-label="关闭模型管理">关闭</button></div><div class="manager-toolbar"><div class="status-legend"><span class="inventory-badge ready">已导入 (async()=>{const $=id=>document.getElementById(id);let pickerType='',pendingIndex=0;function renderPicker(){const select=$(pickerType),q=$('modelSearch').value.trim().toLowerCase(),list=$('modelList');list.replaceChildren();[...select.options].forEach((o,i)=>{if(!o.textContent.toLowerCase().includes(q))return;const label=document.createElement('label');label.className='model-option';const radio=document.createElement('input');radio.type='radio';radio.name='model-choice';radio.value=String(i);radio.checked=i===pendingIndex;radio.onchange=()=>{pendingIndex=i};label.append(radio,document.createTextNode(o.textContent));list.append(label)});if(!list.children.length)list.textContent='没有匹配的模型'}function openPicker(type){pickerType=type;pendingIndex=$(type).selectedIndex;$('modelDialogTitle').textContent=type==='deepseek'?'选择 DeepSeek 模型':'选择 Whisper 模型';$('modelSearch').value='';renderPicker();$('modelDialog').showModal();$('modelSearch').focus()}$('modelSearch').oninput=renderPicker;$('modelCancel').onclick=()=>$('modelDialog').close();$('modelConfirm').onclick=()=>{const select=$(pickerType);select.selectedIndex=pendingIndex;select.dispatchEvent(new Event('change'));$('modelDialog').close()};if(window.parent!==window)$('backToWorkspace').hidden=true;try{let r=await fetch('/api/local-models/catalog');if(!r.ok)throw Error('读取清单失败');let x=await r.json();for(const type of ['deepseek','whisper']){for(const model of x[type]){const o=document.createElement('option');o.value=type==='deepseek'?model.source+'/file/view/master/'+encodeURIComponent(model.file)+'?status=1':model.source;o.textContent=model.name;o.dataset.modelId=model.id;$(type).append(o)}const select=$(type),link=$(type+'Link');function update(){link.href=select.value;$(type+'Picker').firstElementChild.textContent=select.selectedOptions[0]?.textContent||'选择模型'}select.onchange=update;$(type+'Picker').onclick=()=>openPicker(type);update()}}catch(e){$('status').textContent=e.message}async function refresh(){await window.refreshLocalEnvironment()}$('refresh').onclick=refresh;await refresh();const directory=$('directory');try{directory.value=localStorage.getItem('gentlypick-model-download-dir')||directory.value}catch{}let previous=null;function size(n){return (n/1048576).toFixed(1)+' MB'}async function poll(){try{let r=await fetch('/api/local-models/download');let j=(await r.json()).job;if(!j)return;let active=['downloading','checking','importing'].includes(j.state);$('download').disabled=active;$('cancelDownload').disabled=j.state!=='downloading';if(j.total){$('downloadProgress').value=Math.min(100,j.downloaded/j.total*100)}else if(active)$('downloadProgress').removeAttribute('value');else $('downloadProgress').value=['downloaded','installed'].includes(j.state)?100:0;let now=Date.now(),speed=previous&&previous.id===j.id?Math.max(0,(j.downloaded-previous.bytes)/Math.max(0.001,(now-previous.time)/1000)):0;previous={id:j.id,bytes:j.downloaded,time:now};$('downloadStatus').textContent=({downloading:'下载中',checking:'校验中',downloaded:'下载完成',importing:'正在导入 Ollama',installed:'安装完成',failed:'下载失败',cancelled:'已取消'})[j.state]+' · '+size(j.downloaded)+(j.total?' / '+size(j.total):'')+(active?' · '+size(speed)+'/s':'')+(j.error?' · '+j.error:'')+(['downloaded','installed'].includes(j.state)?(j.verified?' · SHA-256 已核对':' · 已检查文件格式，未核对发布方哈希')+' · '+j.path+(j.modelName?' · '+j.modelName:''):'');}catch{$('downloadStatus').textContent='无法读取下载状态'}}$('download').onclick=async()=>{try{if($('installAfter').checked)await window.ensureLocalRuntime();const dir=directory.value.trim(),id=$('deepseek').selectedOptions[0]?.dataset.modelId;try{localStorage.setItem('gentlypick-model-download-dir',dir)}catch{}const r=await fetch('/api/local-models/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,directory:dir,install:$('installAfter').checked})});const data=await r.json();if(!r.ok)throw Error(data.error||'下载启动失败');previous=null;await poll()}catch(e){$('downloadStatus').te
