<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地模型</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:#283e32;font:15px/1.6 system-ui,'Microsoft YaHei',sans-serif}main{max-width:1000px;margin:auto;padding:36px 22px}header,.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.card{background:white;border:1px solid #e2e9e0;border-radius:16px;padding:22px;margin:18px 0}select{width:100%;padding:11px;border:1px solid #d8e4d8;border-radius:9px;font:inherit;background:white}button,a{font:inherit;color:#365c43;background:#eff5ed;border:1px solid #dce7da;border-radius:9px;padding:9px 14px;cursor:pointer;text-decoration:none}small{color:#718779}#status{white-space:pre-wrap}html[data-theme="dark"] body{background:#171b19;color:#e6eee8}html[data-theme="dark"] .card{background:#202623;color:#e6eee8;border-color:#39463e}html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:#171d19!important;color:#e6eee8;border-color:#47564a!important}html[data-theme="dark"] button,html[data-theme="dark"] a{background:#303e34;color:#e1eee4;border-color:#48594b}html[data-theme="dark"] .muted,html[data-theme="dark"] small{color:#a8baad}.model-picker{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;background:var(--picker-bg,#fff)}dialog.model-dialog{width:min(460px,calc(100vw - 32px));max-height:min(570px,calc(100vh - 48px));border:1px solid #dce7da;border-radius:16px;padding:20px;background:#fff;color:#283e32;box-shadow:0 18px 65px #0003}dialog.model-dialog::backdrop{background:#0006}.model-dialog h2{margin:0 0 12px}.model-dialog input[type=search]{width:100%;padding:10px;border:1px solid #d8e4d8;border-radius:9px;font:inherit}.model-list{max-height:300px;overflow:auto;margin:12px 0;display:grid;gap:3px}.model-option{display:flex;gap:10px;align-items:center;padding:9px;border-radius:8px;cursor:pointer}.model-option:hover{background:#eff5ed}.model-option input{accent-color:#496e5b}.model-actions{display:flex;justify-content:flex-end;gap:8px}.model-picker[disabled]{opacity:.5}html[data-theme=dark]{--picker-bg:#202623}html[data-theme=dark] dialog.model-dialog{background:#202623;color:#e6eee8;border-color:#47564a}html[data-theme=dark] .model-option:hover{background:#303e34}</style><script>try{document.documentElement.dataset.theme=localStorage.getItem('gentlypick-theme')||'light'}catch{}</script><main><header><h1>本地模型</h1><a href="/" id="backToWorkspace">返回轻摘</a></header><section class="card"><div class="row"><h2>运行状态</h2><button id="refresh">刷新</button></div><p id="status">正在检查…</p></section><section class="card"><h2>DeepSeek</h2><select id="deepseek" aria-label="DeepSeek 版本" hidden></select><button class="model-picker" id="deepseekPicker" type="button" aria-haspopup="dialog"><span>选择模型</span><span aria-hidden="true">⌄</span></button><label>保存目录 <input id="directory" type="text" placeholder="例如 D:\DeepSeekLocal\downloads" style="width:100%;padding:10px;border:1px solid #d8e4d8;border-radius:9px"></label><p><button id="download">下载所选版本</button> <button id="cancelDownload" disabled>取消</button></p><label><input type="checkbox" id="installAfter" checked> 下载后导入 Ollama</label><progress id="downloadProgress" max="100" value="0" style="width:100%"></progress><p id="downloadStatus" role="status"></p><p><a id="deepseekLink" href="https://modelscope.cn" target="_blank" rel="noopener">查看模型文件</a></p></section><section class="card"><div class="row"><h2>Whisper</h2><button id="discoverWhisper" type="button">自动查找</button></div><small id="discoveryStatus" role="status"></small><select id="whisper" aria-label="Whisper 版本" hidden></select><button class="model-picker" id="whisperPicker" type="button" aria-haspopup="dialog"><span>选择模型</span><span aria-hidden="true">⌄</span></button><label>模型保存目录 <input id="whisperDirectory" type="text" placeholder="例如 D:\DeepSeekLocal" style="width:100%;padding:10px;border:1px solid #d8e4d8;border-radius:9px"></label><label>Python 路径 <input id="pythonPath" type="text" placeholder="Python 3.10–3.12 的 python.exe 完整路径" style="width:100%;padding:10px;border:1px solid #d8e4d8;border-radius:9px"></label><p><button id="whisperInstall">安装所选版本</button> <button id="whisperCancel" disabled>取消</button></p><p id="whisperStatus" role="status"></p><p><a id="whisperLink" href="https://huggingface.co" target="_blank" rel="noopener">查看模型文件</a></p></section></main><dialog class="model-dialog" id="modelDialog" aria-labelledby="modelDialogTitle"><h2 id="modelDialogTitle">选择模型</h2><input id="modelSearch" type="search" placeholder="搜索模型" aria-label="搜索模型"><div class="model-list" id="modelList"></div><div class="model-actions"><button id="modelCancel" type="button">取消</button><button id="modelConfirm" type="button">确认</button></div></dialog><script>
(async()=>{const $=id=>document.getElementById(id);let pickerType='',pendingIndex=0;function renderPicker(){const select=$(pickerType),q=$('modelSearch').value.trim().toLowerCase(),list=$('modelList');list.replaceChildren();[...select.options].forEach((o,i)=>{if(!o.textContent.toLowerCase().includes(q))return;const label=document.createElement('label');label.className='model-option';const radio=document.createElement('input');radio.type='radio';radio.name='model-choice';radio.value=String(i);radio.checked=i===pendingIndex;radio.onchange=()=>{pendingIndex=i};label.append(radio,document.createTextNode(o.textContent));list.append(label)});if(!list.children.length)list.textContent='没有匹配的模型'}function openPicker(type){pickerType=type;pendingIndex=$(type).selectedIndex;$('modelDialogTitle').textContent=type==='deepseek'?'选择 DeepSeek 模型':'选择 Whisper 模型';$('modelSearch').value='';renderPicker();$('modelDialog').showModal();$('modelSearch').focus()}$('modelSearch').oninput=renderPicker;$('modelCancel').onclick=()=>$('modelDialog').close();$('modelConfirm').onclick=()=>{const select=$(pickerType);select.selectedIndex=pendingIndex;select.dispatchEvent(new Event('change'));$('modelDialog').close()};if(window.parent!==window)$('backToWorkspace').hidden=true;try{let r=await fetch('/api/local-models/catalog');if(!r.ok)throw Error('读取清单失败');let x=await r.json();for(const type of ['deepseek','whisper']){for(const model of x[type]){const o=document.createElement('option');o.value=type==='deepseek'?model.source+'/file/view/master/'+encodeURIComponent(model.file)+'?status=1':model.source;o.textContent=model.name;o.dataset.modelId=model.id;$(type).append(o)}const select=$(type),link=$(type+'Link');function update(){link.href=select.value;$(type+'Picker').firstElementChild.textContent=select.selectedOptions[0]?.textContent||'选择模型'}select.onchange=update;$(type+'Picker').onclick=()=>openPicker(type);update()}}catch(e){$('status').textContent=e.message}async function refresh(){try{const r=await fetch('/api/local-models/installed');if(!r.ok)throw Error();const x=await r.json();$('status').textContent=x.available?(x.models.length?x.models.map(y=>y.name).join('\n'):'Ollama 已启动，未发现已安装模型'):'Ollama 未启动'}catch{$('status').textContent='无法读取模型状态'}}$('refresh').onclick=refresh;await refresh();const directory=$('directory');try{directory.value=localStorage.getItem('gentlypick-model-download-dir')||''}catch{}let previous=null;function size(n){return (n/1048576).toFixed(1)+' MB'}async function poll(){try{let r=await fetch('/api/local-models/download');let j=(await r.json()).job;if(!j)return;let active=['downloading','checking','importing'].includes(j.state);$('download').disabled=active;$('cancelDownload').disabled=j.state!=='downloading';if(j.total){$('downloadProgress').value=Math.min(100,j.downloaded/j.total*100)}else if(active)$('downloadProgress').removeAttribute('value');else $('downloadProgress').value=['downloaded','installed'].includes(j.state)?100:0;let now=Date.now(),speed=previous&&previous.id===j.id?Math.max(0,(j.downloaded-previous.bytes)/Math.max(0.001,(now-previous.time)/1000)):0;previous={id:j.id,bytes:j.downloaded,time:now};$('downloadStatus').textContent=({downloading:'下载中',checking:'校验中',downloaded:'下载完成',importing:'正在导入 Ollama',installed:'安装完成',failed:'下载失败',cancelled:'已取消'})[j.state]+' · '+size(j.downloaded)+(j.total?' / '+size(j.total):'')+(active?' · '+size(speed)+'/s':'')+(j.error?' · '+j.error:'')+(['downloaded','installed'].includes(j.state)?(j.verified?' · SHA-256 已核对':' · 已检查文件格式，未核对发布方哈希')+' · '+j.path+(j.modelName?' · '+j.modelName:''):'');}catch{$('downloadStatus').textContent='无法读取下载状态'}}$('download').onclick=async()=>{try{const dir=directory.value.trim(),id=$('deepseek').selectedOptions[0]?.dataset.modelId;try{localStorage.setItem('gentlypick-model-download-dir',dir)}catch{}const r=await fetch('/api/local-models/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,directory:dir,install:$('installAfter').checked})});const data=await r.json();if(!r.ok)throw Error(data.error||'下载启动失败');previous=null;await poll()}catch(e){$('downloadStatus').textContent=e.message}};$('cancelDownload').onclick=async()=>{await fetch('/api/local-models/download/cancel',{method:'POST'});await poll()};await poll();setInterval(poll,1000);for(const [field,key] of [['whisperDirectory','gentlypick-whisper-dir'],['pythonPath','gentlypick-python-path']]){try{$(field).value=localStorage.getItem(key)||''}catch{}}async function discoverWhisper(show){try{const r=await fetch('/api/local-models/discover');if(!r.ok)throw Error();const x=await r.json();if(x.python&&!$('pythonPath').value.trim())$('pythonPath').value=x.python;if(x.directory&&!$('whisperDirectory').value.trim())$('whisperDirectory').value=x.directory;if(show)$('discoveryStatus').textContent=x.configured?'已找到本地运行环境':x.python?'已找到 Python，选择模型后可安装':'未找到 Python，请填写路径';}catch{if(show)$('discoveryStatus').textContent='自动查找失败'}}$('discoverWhisper').onclick=()=>discoverWhisper(true);await discoverWhisper(false);async function pollWhisper(){try{const r=await fetch('/api/local-models/whisper');const x=await r.json(),j=x.job;if(!j){$('whisperStatus').textContent=x.configured?'运行环境已配置':'';return}$('whisperInstall').disabled=j.state==='installing';$('whisperCancel').disabled=j.state!=='installing';$('whisperStatus').textContent=j.stage+(j.error?' · '+j.error:'')+(j.state==='installed'?' · '+j.model:'')}catch{$('whisperStatus').textContent='无法读取安装状态'}}$('whisperInstall').onclick=async()=>{try{const dir=$('whisperDirectory').value.trim(),python=$('pythonPath').value.trim(),id=$('whisper').selectedOptions[0]?.dataset.modelId;try{localStorage.setItem('gentlypick-whisper-dir',dir);localStorage.setItem('gentlypick-python-path',python)}catch{}const r=await fetch('/api/local-models/whisper',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,directory:dir,python})});const d=await r.json();if(!r.ok)throw Error(d.error||'启动失败');await pollWhisper()}catch(e){$('whisperStatus').textContent=e.message}};$('whisperCancel').onclick=async()=>{await fetch('/api/local-models/whisper/cancel',{method:'POST'});await pollWhisper()};await pollWhisper();setInterval(pollWhisper,1000)})();
</script><script src="/folder-picker.js"></script></html>
