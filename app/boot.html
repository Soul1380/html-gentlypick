<section class="intro" id="intro" aria-label="加载动画预览"><div class="eyebrow">A LITTLE SPACE FOR IDEAS</div><h1><span class="word">正在准备</span><span class="word">灵感就绪</span></h1><p class="subtitle">让每一份发现，都有归处</p><div class="track" role="progressbar" aria-label="启动阶段" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill"></div></div><div class="status" aria-label="正在准备工作空间"><span class="status-animated" aria-hidden="true"><span class="status-char" style="animation-name:statusJump0">正</span><span class="status-char" style="animation-name:statusJump1">在</span><span class="status-char" style="animation-name:statusJump2">准</span><span class="status-char" style="animation-name:statusJump3">备</span><span class="status-char" style="animation-name:statusJump4">工</span><span class="status-char" style="animation-name:statusJump5">作</span><span class="status-char" style="animation-name:statusJump6">空</span><span class="status-char" style="animation-name:statusJump7">间</span><span class="status-char" style="animation-name:statusJump8"> </span><span class="status-char" style="animation-name:statusJump9">·</span><span class="status-char" style="animation-name:statusJump10"> </span><span class="status-char status-number" style="animation-name:statusJump11"><span id="percent">0</span>%</span></span></div></section><div style="position:absolute;bottom:40px;width:100%;text-align:center"><div id="stage" role="status">正在加载工作空间</div><button id="retry" class="pill" hidden>重新加载</button></div></main><script>const scene=document.querySelector('.scene');let done=false;const reduce=matchMedia('(prefers-reduced-motion: reduce)');const paths=[[[4,5],[35,-12],[66,18],[38,59],[-8,40],[4,5]],[[72,8],[48,48],[4,56],[26,0],[66,-9],[72,8]],[[28,69],[-10,28],[36,-12],[68,37],[55,69],[28,69]],[[72,62],[35,73],[9,35],[43,9],[79,30],[72,62]],[[14,46],[43,68],[78,45],[58,7],[8,3],[14,46]]];document.querySelectorAll('.orbit').forEach((el,i)=>{el.style.transform='translate('+paths[i][0][0]+'
