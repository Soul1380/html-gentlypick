<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="/video-lab/logo.png"><title>轻摘 · 视频时间轴</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f5;color:#2c4036;font:14px/1.65 system-ui,'Microsoft YaHei',sans-serif}main{max-width:1300px;margin:auto;padding:30px 24px}h1{font-size:28px;font-weight:600;margin:4px 0}h2{font-size:18px;margin:0 0 16px}small,.muted{color:#718579}header,.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row{margin-top:12px}header{justify-content:space-between;margin-bottom:24px}.layout{display:grid;grid-template-columns:1.15fr 1fr;gap:22px}.card{background:white;border:1px solid #e1e8e0;border-radius:18px;padding:22px;margin-bottom:20px}video{width:100%;max-height:370px;background:#17261e;border-radius:12px}label{display:block;margin:12px 0 5px}input:not([type=checkbox]),textarea{width:100%;padding:9px 11px;border:1px solid #dbe4d8;border-radius:8px;background:#fafcf9;color:inherit;font:inherit}textarea{min-height:90px;resize:vertical}button,.link{font:inherit;border:1px solid #dce5da;border-radius:9px;padding:9px 13px;background:#eff5ed;color:inherit;cursor:pointer;transition:background .2s,transform .2s;text-decoration:none;user-select:none}button:hover{background:#dfeadf;transform:translateY(-1px)}button:disabled{opacity:.45;cursor:default;transform:none}.primary{background:#426b52;color:white}summary{cursor:pointer;user-select:none}details{margin-top:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:200px;overflow:auto}progress{width:100%;accent-color:#64896e}.item{display:grid;grid-template-columns:280px 1fr;gap:22px;border-top:1px solid #e3e9e1;padding:24px 0}.item img{width:100%;border-radius:10px;background:#e9eee7;min-height:100px}.item h3{margin:4px 0}.item p{white-space:pre-wrap}.item input[type=number]{width:100px}.badge{font-size:12px;background:#edf2e9;border-radius:5px;padding:3px 7px}blockquote{border-left:3px solid #cadbca;padding-left:12px;color:#687f71;margin:12px 0}#markers{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}#log{max-height:110px}#summary{white-space:pre-wrap}@media(max-width:800px){.layout,.item{grid-template-columns:1fr}main{padding:20px 12px}}@media print{.settings,.viewer,.process,header .link,.edit,.toolbar{display:none!important}.layout{display:block}body{background:white}.item{break-inside:avoid}.card{border:0}main{padding:0}}

#result{display:flex;gap:42px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#bdd1bd transparent;padding:20px 4px 26px;cursor:grab;touch-action:pan-y}#result.dragging{cursor:grabbing;user-select:none}#result .item{display:block;flex:0 0 320px;border:1px solid #e1e9df;border-radius:16px;padding:15px}#result .item.active{border-color:#679a73;box-shadow:0 0 0 2px #b9d5bf}#result .item img{height:180px;object-fit:cover}#result .item img.extra{height:110px;width:150px}#result .item .row{gap:6px}#result .item button{padding:6px 9px;font-size:12px}.compact-settings{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.compact-settings input{width:90px!important}#restoreLocal{display:none}

body.result-step main{max-width:none;padding:12px 22px}body.result-step main>header,body.result-step .layout,body.result-step .process{display:none}body:not(.result-step) #resultPage{display:none}body.result-step #resultPage{display:flex;flex-direction:column;height:calc(100vh - 24px);padding:14px;margin:0;overflow:hidden}#videoResult{display:none}body.result-step #videoResult{display:block;flex:0 1 34vh;min-height:130px;text-align:center}body.result-step #videoResult video{height:100%;max-height:32vh;width:auto;max-width:100%}body.result-step #result{flex:1;min-height:0;overflow:auto;align-items:flex-start;padding:8px 4px}body.result-step #resultPage>header{margin-bottom:4px}body.result-step #summary{display:none}body.result-step #result .item img{height:110px}body.result-step #result .item{flex-basis:280px;padding:10px}body.result-step #result .item p{font-size:13px;line-height:1.5}body.result-step .compact-settings{gap:5px}.step-actions{display:flex;gap:8px}.correction-note{font-size:12px;color:#687d70;white-space:pre-wrap}
html[data-theme="dark"] body{background:#171b19;color:#e6eee8}html[data-theme="dark"] .card{background:#202623;color:#e6eee8;border-color:#39463e}html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:#171d19!important;color:#e6eee8;border-color:#47564a!important}html[data-theme="dark"] button,html[data-theme="dark"] a{background:#303e34;color:#e1eee4;border-color:#48594b}html[data-theme="dark"] .muted,html[data-theme="dark"] small{color:#a8baad}</style><script>try{document.documentElement.dataset.theme=localStorage.getItem('gentlypick-theme')||'light'}catch{}</script><main><header><div><img src="/video-lab/logo.png" alt="轻摘" style="width:54px;height:54px;object-fit:contain;float:left;margin:0 14px 0 0"><small>GENTLYPICK / VIDEO LAB</small><h1>听懂视频，整理成图文时间轴</h1></div><a class="link" href="/">返回轻摘</a></header><div class="layout"><div class="viewer"><section class="card"><label>导入视频<input id="file" type="file" accept="video/*"></label><p class="muted" id="meta">测试版：20 分钟以内、300 MB 以内。原视频仅在本机处理。</p><div id="videoSetup"><video id="video" controls preload="metadata"></video></div><div id="markers"></div></section><section class="card"><h2>已有字幕也可以直接分析</h2><input id="subtitleFile" type="file" accept=".srt,.vtt,.json"><small>支持带时间戳的 SRT / VTT 或包含 segments 的 JSON，不必再次转写。</small></section><section class="card process"><h2>处理过程</h2><div id="status" role="status">等待导入视频</div><progress id="progress" max="100" value="0"></progress><pre id="log"></pre><details><summary>查看转写原文与实际分析要求</summary><textarea id="transcript" readonly></textarea><pre id="request"></pre></details></section></div><section class="card settings"><h2>接口设置</h2><details open><summary>① 语音转文字</summary><div class="row"><select id="whisperChoice" aria-label="Whisper 版本"><option value="tiny">tiny</option><option value="base">base</option><option value="small">small</option><option value="medium">medium</option><option value="large-v3">large-v3</option><option value="large-v3-turbo">large-v3-turbo</option></select><button type="button" id="localPreset">使用本地 Whisper</button></div><label>完整转写接口<input id="asrEndpoint" placeholder="https://服务地址/v1/audio/transcriptions"></label><label>语音模型名称<input id="asrModel" placeholder="支持 verbose_json 分段时间戳的模型"></label><label>语音接口密钥<input id="asrKey" type="password" autocomplete="off"></label><small>兼容 Whisper 转写协议；本地语音服务也可填写。</small></details><details open><summary>② 文字整理分析</summary><div class="row"><button type="button" id="localDeepseek">使用本地模型</button><select id="ollamaModel" aria-label="本地文字模型"><option value="">选择已安装模型</option></select><button type="button" id="refreshOllama">刷新</button></div><label>完整分析接口<input id="endpoint" placeholder="https://服务地址/v1/chat/completions"></label><label>文字模型名称<input id="model" placeholder="可使用支持文字分析的模型"></label><label>分析接口密钥<input id="key" type="password" autocomplete="off"></label></details><label>整理要求<textarea id="prompt">按内容主题整理要点，提取关键信息、操作步骤和结论。保留原话依据，合并相邻重复内容。</textarea></label><label><input id="consent" type="checkbox"> 允许本地转写或向所选接口发送音频，并向分析接口发送文字</label><small>配图在本机截取，不上传。密钥不写入文件。</small><div class="row"><label><input type="checkbox" id="correctSpeech" checked> AI 校对转写</label></div><div class="row"><button type="button" id="nextStep">下一步 →</button><button id="run" class="primary" disabled>转写并分析</button><button id="transcribeOnly" disabled>仅转写</button><button id="analyze" disabled>分析已有转写</button><button id="cancel" disabled>取消</button></div></section></div><section class="card" id="resultPage"><header><div class="step-actions"><button id="previousStep" type="button">← 上一步</button><h2>图文时间轴</h2></div><div class="row toolbar"><button id="export" disabled>下载图文 HTML</button><button id="save" disabled>保存可编辑结果</button><label style="margin:0">恢复结果<input id="restore" type="file" accept=".json"></label></div></header><div id="videoResult"></div><p id="summary">结果会包含时间范围、内容要点、原话和截图。截图时间为片段内的初始候选，可手动调整。</p><div class="compact-settings"><label><input id="follow" type="checkbox" checked> 跟随播放</label><button id="resumeFollow" type="button">定位当前</button><span>分析范围（秒）</span><input id="rangeStart" type="number" min="0" value="0" aria-label="开始秒"><input id="rangeEnd" type="number" min="0" aria-label="结束秒"><button id="analyzeRange" type="button" disabled>分析选中范围</button><button id="restoreLocal" type="button">恢复上次结果</button></div><div id="result" tabindex="0"></div></section></main><script src="/video-lab/app.js"></script></html>
